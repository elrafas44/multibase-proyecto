services:
  mongo:
    image: mongo:latest
    container_name: multibase-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/multibase
    ports:
      - "3000:3000"
    depends_on:
      - mongo

volumes:
  mongo_data:
    external: true